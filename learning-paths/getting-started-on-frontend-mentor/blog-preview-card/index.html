<!doctype html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
          <link rel="preconnect" href="https://fonts.googleapis.com" />
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
          <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@100..900&display=swap" rel="stylesheet" />

          <title>Frontend Mentor | Blog preview card</title>

          <style>
               :root {
                    font-size: 16px;
                    --white: hsl(0, 0%, 100%);
                    --yellow: hsl(47, 88%, 63%);
                    --gray-500: hsl(0, 0%, 42%);
                    --gray-950: hsl(80, 0%, 7%);
                    --font-family: "Figtree", sans-serif;
                    --font-regular: 500;
                    --font-bold: 800;
                    --font-size-base: 1rem;
                    --font-size-small: 0.875rem;
                    font-family: var(--font-family);
                    font-weight: var(--font-regular);
                    --outer-radius: 1.375rem;
                    --card-padding: 1.4rem;
                    --inner-radius: calc(var(--outer-radius) - var(--card-padding));

                    @media screen and (max-width: 375px) {
                         font-size: 14px;
                         --card-padding: 1.55rem;
                    }
               }
               body {
                    background-color: var(--yellow);
                    height: 100svh;
                    width: 100vw;
                    display: grid;
                    grid-template-rows: 1fr 50px;
                    margin: 0;
               }
               h1.title {
                    font-size: 1rem;
                    line-height: 1;
                    margin: 0.5rem 0 0 0.5rem;
                    color: var(--slate-500);
                    font-weight: var(--font-regular);
                    position: absolute;
               }
               .comparisons {
                    position: absolute;
                    justify-self: flex-start;
                    align-self: flex-end;
                    z-index: 3000;
                    background: var(--slate-500);
                    color: white;
                    margin: 0 0 0.5rem 0.5rem;
                    padding: 0.5rem 0.75rem 0.75rem 0.75rem;
                    border-radius: 0.5rem;
                    & legend {
                         display: inline-block;
                         font-size: 0.875rem;
                         margin-bottom: -0.125rem;
                    }
                    & label {
                         font-size: 0.875rem;
                         margin-right: 0.5rem;
                         &:last-of-type {
                              margin-right: 0.5rem;
                         }
                    }
                    & input {
                         transform: translateY(2px);
                    }
               }
               .desktop-compare {
                    height: auto;
                    opacity: 0%;
                    grid-row: 1/2;
                    position: absolute;
                    mix-blend-mode: difference;
                    object-fit: cover;
                    pointer-events: none;
                    width: 1440px;
                    place-self: center;
                    transform: translateY(0px);
                    z-index: 9999;
               }
               body:has(input#desktop:checked) .desktop-compare {
                    opacity: 60%;
               }
               .mobile-compare {
                    height: auto;
                    opacity: 0%;
                    grid-row: 1/2;
                    position: absolute;
                    mix-blend-mode: difference;
                    object-fit: cover;
                    pointer-events: none;
                    width: 375px;
                    place-self: center;
                    z-index: 9999;
                    transform: translateY(0px);
               }
               body:has(input#mobile:checked) .mobile-compare {
                    opacity: 60%;
               }
               main {
                    grid-row: 1/2;
                    height: 100%;
                    width: auto;
                    display: grid;
               }
               article {
                    display: flex;
                    flex-direction: column;
                    place-self: center;
                    gap: 1.5rem;
                    padding: var(--card-padding);
                    background-color: var(--white);
                    border-radius: var(--outer-radius);
                    border: 2px solid var(--gray-950);
                    max-width: 21rem;
                    text-align: left;
                    box-shadow: 8px 8px var(--gray-950);
                    @media screen and (max-width: 375px) {
                         max-width: 20rem;
                         gap: 1.7rem;
                    }
                    & .image-area {
                         border-radius: 0.75rem;
                         overflow: hidden;
                         margin: 0;
                         height: 100%;
                         width: 100%;
                         display: flex;
                         padding: 0;
                         position: relative;
                         aspect-ratio: 16/9.5;
                         @media screen and (max-width: 375px) {
                              aspect-ratio: 16/11.5;
                         }
                         & img {
                              height: 100%;
                              width: 100%;
                              object-fit: cover;
                              object-position: center center;
                              position: absolute;
                              z-index: inherit;
                              inset: 0;
                         }
                    }
                    & .content-area {
                         display: flex;
                         flex-direction: column;
                         gap: 1rem;
                         @media screen and (max-width: 375px) {
                              gap: 1.25rem;
                         }
                         & > * {
                              margin: 0;
                         }
                         & .post-meta {
                              display: flex;
                              flex-direction: column;
                              gap: 0.8rem;
                              @media screen and (max-width: 375px) {
                                   gap: 0.9rem;
                              }
                         }
                         & .tag-category {
                              background: var(--yellow);
                              width: fit-content;
                              padding: 0.4rem 0.8rem;
                              font-size: var(--font-size-small);
                              font-weight: var(--font-bold);
                              border-radius: 0.25rem;
                              line-height: 1.2;
                              @media screen and (max-width: 375px) {
                                   padding: 0.4rem 0.9rem;
                              }
                         }
                         & .publish-timestamp {
                              font-size: var(--font-size-small);
                              color: var(--gray-950);
                         }
                    }
                    & h2 {
                         color: var(--gray-950);
                         font-size: 1.475rem;
                         line-height: 1.25;
                         letter-spacing: 0.015em;
                         margin-top: 0.075rem;
                         @media screen and (max-width: 375px) {
                              font-size: 1.4rem;
                         }
                    }
                    & p.article-excerpt {
                         color: var(--gray-500);
                         line-height: 1.5;
                         letter-spacing: 0em;
                         margin-bottom: 0.5rem;
                         @media screen and (max-width: 375px) {
                              margin-bottom: 0.25rem;
                         }
                    }
                    & footer {
                         display: flex;
                         flex-direction: row;
                         align-items: center;
                         gap: 0.75rem;
                         font-weight: var(--font-bold);
                         font-size: var(--font-size-small);

                         & p {
                              margin: 0;
                              line-height: 1;
                         }
                         & img {
                              height: 2.0625rem;
                              width: auto;
                              @media screen and (max-width: 375px) {
                                   height: 2.375rem;
                              }
                         }
                    }
               }

               .attribution {
                    grid-row: 2/3;
                    font-size: 0.75rem;
                    text-align: center;
                    position: fixed;
                    bottom: 0;
                    place-self: center;
                    background: rgb(238, 238, 238);
                    width: 100%;
                    padding: 1rem;
                    font-family: var(--font-family);
               }
               .attribution a {
                    color: hsl(228, 45%, 44%);
               }
          </style>
     </head>
     <body>
          <main>
               <h1 class="title">Getting Started on Frontend Mentor / QR Code Component</h1>
               <img class="desktop-compare" alt="Reference for exercise's desktop design" src="design/desktop-design.jpg" />
               <img class="mobile-compare" alt="Reference for exercise's mobile design" src="design/mobile-design.jpg" />
               <article>
                    <figure class="image-area">
                         <img src="assets/images/illustration-article.svg" alt="QR Code" />
                    </figure>
                    <section class="content-area">
                         <header class="post-meta">
                              <span class="tag-category">Learning</span>
                              <time datetime="2023-12-21" class="publish-timestamp">Published 21 Dec 2023</time>
                         </header>
                         <h2 class="article-title">HTML & CSS foundations</h2>
                         <p class="article-excerpt">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                         <footer>
                              <img src="assets/images/image-avatar.webp" alt="Picture of article author" />
                              <p>Greg Hooper</p>
                         </footer>
                    </section>
               </article>
               <aside class="comparisons">
                    <fieldset>
                         <legend>Reference Toggles</legend>
                         <input type="checkbox" id="desktop" aria-label="Toggles visibility of desktop reference image overlay." />
                         <label for="desktop"> Desktop </label>
                         <input type="checkbox" id="mobile" aria-label="Toggles visibility of mobile reference image overlay." />
                         <label for="mobile"> Mobile </label>
                    </fieldset>
               </aside>
          </main>

          <footer class="attribution">Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a href="#">Caleb Peters</a>.</footer>
          <!-- <script src="" async defer></script> -->
     </body>
</html>
