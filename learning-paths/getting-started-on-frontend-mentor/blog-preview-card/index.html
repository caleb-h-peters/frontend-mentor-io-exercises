<html lang="en">
     <head>
          <meta charset="UTF-8" />

          <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
          <link rel="preconnect" href="https://fonts.googleapis.com" />

          <main>
               <h1 class="title">Getting Started on Frontend Mentor / Blog Preview Card</h1>

                      <span class="post-category">Learning</span>

                      <h2 class="post-title"><a href="#">HTML & CSS foundations</a></h2>
                <p class="post-excerpt">These languages are the backbone of every website, defining structure, content, and presentation.</p>

                <footer class="post-author">
                    <img src="assets/images/image-avatar.webp" alt="Picture of article author" />

                </footer>
                    </section>
               </article>
