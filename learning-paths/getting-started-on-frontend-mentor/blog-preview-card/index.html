<!doctype html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
          <link rel="preconnect" href="https://fonts.googleapis.com" />
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
          <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@100..900&display=swap" rel="stylesheet" />
          <link href="assets/styles.css" rel="stylesheet" />
          <title>Frontend Mentor | Blog preview card</title>
     </head>
     <body>
          <main>
               <h1 class="title">Getting Started on Frontend Mentor / Blog Preview Card</h1>
               <img class="desktop-compare" alt="Reference for exercise's desktop design" src="design/desktop-design.jpg" />
               <img class="mobile-compare" alt="Reference for exercise's mobile design" src="design/mobile-design.jpg" />
               <article>
                    <figure class="image-area">
                         <img src="assets/images/illustration-article.svg" alt="QR Code" />
                    </figure>
                    <section class="content-area">
                         <header class="post-meta">
                              <span class="tag-category">Learning</span>
                              <time datetime="2023-12-21" class="publish-timestamp">Published 21 Dec 2023</time>
                         </header>
                         <h2 class="article-title">HTML & CSS foundations</h2>
                         <p class="article-excerpt">These languages are the backbone of every website, defining structure, content, and presentation.</p>
                         <footer>
                              <img src="assets/images/image-avatar.webp" alt="Picture of article author" />
                              <p>Greg Hooper</p>
                         </footer>
                    </section>
               </article>
               <aside class="comparisons">
                    <fieldset>
                         <legend>Reference Toggles</legend>
                         <input type="checkbox" id="desktop" aria-label="Toggles visibility of desktop reference image overlay." />
                         <label for="desktop"> Desktop </label>
                         <input type="checkbox" id="mobile" aria-label="Toggles visibility of mobile reference image overlay." />
                         <label for="mobile"> Mobile </label>
                    </fieldset>
               </aside>
          </main>

          <footer class="attribution">Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a href="#">Caleb Peters</a>.</footer>
          <!-- <script src="" async defer></script> -->
     </body>
</html>
