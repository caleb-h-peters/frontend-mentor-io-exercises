<!doctype html>
<html lang="en">
     <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
          <link rel="preconnect" href="https://fonts.googleapis.com" />
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
          <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />

          <title>Frontend Mentor | QR code component</title>

          <style>
               :root {
                    font-size: 15px;
                    --white: hsl(0, 0%, 100%);
                    --slate-300: hsl(212, 45%, 89%);
                    --slate-500: hsl(216, 15%, 48%);
                    --slate-900: hsl(218, 44%, 22%);
                    --font-family: "Outfit", sans-serif;
                    --font-regular: 400;
                    --font-bold: 700;
                    font-family: var(--font-family);
                    font-weight: var(--font-regular);
                    --outer-radius: 1.375rem;
                    --card-padding: 1rem;
                    --inner-radius: calc(var(--outer-radius) - var(--card-padding));
               }
               body {
                    background-color: var(--slate-300);
                    height: 100svh;
                    width: 100vw;
                    display: grid;
                    grid-template-rows: 1fr 50px;
                    margin: 0;
               }
               h1.title {
                    font-size: 1rem;
                    line-height: 1;
                    margin: 0.5rem 0 0 0.5rem;
                    color: var(--slate-500);
                    font-weight: var(--font-regular);
                    position: absolute;
               }
               .comparisons {
                    position: absolute;
                    justify-self: flex-start;
                    align-self: flex-end;
                    z-index: 3000;
                    background: var(--slate-500);
                    color: white;
                    margin: 0 0 0.5rem 0.5rem;
                    padding: 0.5rem 0.75rem 0.75rem 0.75rem;
                    border-radius: 0.5rem;
                    & legend {
                         display: inline-block;
                         font-size: 0.875rem;
                         margin-bottom: -0.125rem;
                    }
                    & label {
                         font-size: 0.875rem;
                         margin-right: 0.5rem;
                         &:last-of-type {
                              margin-right: 0.5rem;
                         }
                    }
                    & input {
                         transform: translateY(2px);
                    }
               }
               .desktop-compare {
                    height: auto;
                    opacity: 0%;
                    grid-row: 1/2;
                    position: absolute;
                    mix-blend-mode: difference;
                    object-fit: cover;
                    pointer-events: none;
                    width: 1440px;
                    place-self: center;
               }
               body:has(input#desktop:checked) .desktop-compare {
                    opacity: 60%;
               }
               .mobile-compare {
                    height: auto;
                    opacity: 0%;
                    grid-row: 1/2;
                    position: absolute;
                    mix-blend-mode: difference;
                    object-fit: cover;
                    pointer-events: none;
                    width: 375px;
                    place-self: center;
               }
               body:has(input#mobile:checked) .mobile-compare {
                    opacity: 60%;
               }
               main {
                    grid-row: 1/2;
                    height: 100%;
                    width: auto;
                    display: grid;
               }
               figure {
                    display: flex;
                    flex-direction: column;
                    place-self: center;
                    gap: 0.4rem;
                    padding: var(--card-padding);
                    padding-bottom: calc(var(--card-padding) + 0.5rem);
                    background-color: var(--white);
                    border-radius: var(--outer-radius);
                    width: 19.25rem;
                    text-align: center;
                    box-shadow: 0px 10px 40px -25px rgba(from var(--slate-900) r g b / 0.4);
                    & div {
                         line-height: 0;
                         border-radius: 0.75rem;
                         overflow: hidden;
                         & img {
                              width: 100%;
                              height: 100%;
                              object-fit: cover;
                         }
                    }
                    & figcaption {
                         display: flex;
                         flex-direction: column;
                         padding: 0 1rem;
                         & h2 {
                              color: var(--slate-900);
                              font-size: 1.425rem;
                              margin-bottom: 0.125rem;
                              line-height: 1.25;
                              letter-spacing: 0.015em;
                         }
                         & p {
                              color: var(--slate-500);
                              line-height: 1.375;
                              letter-spacing: 0.015em;
                         }
                    }
               }
               .attribution {
                    grid-row: 2/3;
                    font-size: 0.75rem;
                    text-align: center;
                    position: fixed;
                    bottom: 0;
                    place-self: center;
                    background: rgb(238, 238, 238);
                    width: 100%;
                    padding: 1rem;
                    font-family: var(--font-family);
               }
               .attribution a {
                    color: hsl(228, 45%, 44%);
               }
          </style>
     </head>
     <body>
          <main>
               <h1 class="title">Getting Started on Frontend Mentor / QR Code Component</h1>
               <img class="desktop-compare" alt="Reference for exercise's desktop design" src="design/desktop-design.jpg" />
               <img class="mobile-compare" alt="Reference for exercise's mobile design" src="design/mobile-design.jpg" />
               <figure>
                    <div>
                         <img src="images/image-qr-code.png" alt="QR Code" />
                    </div>
                    <figcaption>
                         <h2>Improve your front-end skills by building mains</h2>
                         <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level!</p>
                    </figcaption>
               </figure>
               <aside class="comparisons">
                    <fieldset>
                         <legend>Reference Toggles</legend>
                         <input type="checkbox" id="desktop" aria-label="Toggles visibility of desktop reference image overlay." />
                         <label for="desktop"> Desktop </label>
                         <input type="checkbox" id="mobile" aria-label="Toggles visibility of mobile reference image overlay." />
                         <label for="mobile"> Mobile </label>
                    </fieldset>
               </aside>
          </main>

          <footer class="attribution">Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a href="#">Caleb Peters</a>.</footer>
          <script src="" async defer></script>
     </body>
</html>
